[package]
name = "app"
version = "0.5.38"
description = "Nexe desktop client"
authors = ["Decatron"]
license = "AGPL-3.0-only"
repository = "https://github.com/decatrondev/nexe"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["devtools", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", features = ["stream", "json"] }
zip = "2"
tokio = { version = "1", features = ["fs", "io-util", "time"] }
futures-util = "0.3"
sha2 = "0.10"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
# Voice/video engine: the Linux webview (WebKitGTK in the Flatpak runtime) has no WebRTC.
livekit = { version = "0.9.7", features = ["rustls-tls-native-roots"] }
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"
# DeepFilterNet noise suppression. crates.io only has a 2022 release (DFN2), so it comes from git; tract
# is pinned to 0.21.4 because newer versions switch ndarray to 0.16, which this release does not build with.
deep_filter_net = { package = "deep_filter", git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"
tract-hir = "=0.21.4"
tract-pulse = "=0.21.4"
